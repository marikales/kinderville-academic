  if (!v) return "<td></td>";
  const [subj, ts] = v;
  let cls = subj.includes("Английск") ? "eng" : (subj.includes("электив") ? "elect" : "");
  const who = engLabel(subj) || ts.map(trT).join(", ");
  return `<td class="${cls}"><div class="s">${trS(subj)}</div><div class="t">${who}</div></td>`;
}

function render(){
  const L = LANG==="en";
  let h = `<div class="controls"><button class="act" onclick="toggleLang()">${L?"RU":"EN"}</button>
           <button class="act" onclick="window.print()">🖨 ${L?"Print":"Печать"}</button></div>`;
  h += `<p class="note">${L
    ? "English runs in level groups within the stage; on Literature lessons the teachers swap levels."
    : "Английский идёт группами по уровню внутри подступени; на литературе педагоги уровней меняются местами. Обед: младшие 11:55–12:25 (домашняя работа 12:25–13:10), старшие 12:50–13:20 (домашняя работа 13:20–14:05); домашнюю работу ведут оба куратора (Ольга С. + Елизавета)."}</p>`;
  for (const c of CLASSES){
    h += `<h2>${c}</h2><table><tr><th class="timecol">${L?"Lesson · time":"Урок · время"}</th>` +
         DAYS.map((x,i)=>`<th>${L?DAYS_EN[i]:x}</th>`).join("") + "</tr>";
    slots(c).forEach((t,i)=>{
      h += `<tr><td class="timecol">${i+1} · ${TL[t]}</td>`;
      for (let d=0; d<5; d++) h += cellHtml(get(d,t,c));
      h += "</tr>";
    });
    h += "</table>";
  }
  document.getElementById("content").innerHTML = h;
}
function toggleLang(){ LANG = LANG==="ru" ? "en" : "ru"; applyChrome(); render(); }
applyChrome();
render();

</script></body></html>
