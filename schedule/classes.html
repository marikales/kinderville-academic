const ROOM_EN = {"Столовая":"Canteen"};
// Обед и домашка идут в своих кабинетах — они освобождены от уроков.
const HWR = {"Y2":"Alfa 2","Y3-1":"Alfa 3","Y3-2":"Alfa 1",
             "Y4":"Alfa 4","Y5":"Alfa 5","Y6":"Alfa 5"};
function trR(r){ return LANG==="en" ? (ROOM_EN[r]||r) : r; }
function roomLine(r){ return r ? `<div class="rooms"><span class="r">${trR(r)}</span></div>` : ""; }
const DAYS = ["Пн","Вт","Ср","Чт","Пт"];
const DAYS_EN = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const CLASSES = ["Y2","Y3-1","Y3-2","Y4","Y5","Y6"];
const LOWER = ["Y2","Y3-1","Y3-2"];
let LANG = (new URLSearchParams(location.search).get("lang") === "en") ? "en" : "ru";
const TL = {"1":"9:05–9:55","2":"10:05–10:55","3":"11:05–11:55","4L":"13:15–14:05",
            "4U":"12:00–12:50","5":"14:10–15:00","6":"15:10–16:00"};
function slots(c){ return ["1","2","3", LOWER.includes(c)?"4L":"4U", "5","6"]; }
const TITLE_RU = "Расписание по классам", TITLE_EN = "Timetable by Class";
function applyChrome(){
  const L = LANG==="en";
  document.getElementById("pageTitle").textContent = L?TITLE_EN:TITLE_RU;
  document.title = (L?TITLE_EN:TITLE_RU);
  const cr = [["← Портал педагогов","← Teacher Portal"],["День","Day"],["По классам","By class"],["По педагогам","By teacher"],["Кабинеты","Rooms"]];
  cr.forEach((p,i)=>{ const el=document.getElementById("cr"+i); if(el) el.textContent=p[L?1:0]; });
  const ln = document.getElementById("lightNote");
  if(ln) ln.innerHTML = L
    ? "Light programme: Light children can only be in Y3-2, Y4 and Y5.<br>Y2, Y3-1 and Y6 cannot take Light children — their core lessons may sit after lesson 4."
    : "Программа Light: Light-дети могут быть только в Y3-2, Y4 и Y5.<br>В Y2, Y3-1 и Y6 Light-детей быть не может — обязательные уроки этих классов могут стоять после 4-го урока.";
  const d = document.getElementById("draftNote");
  if(d) d.textContent = L ? "Version 28.08 — rooms added. In effect from 1 September; updated whenever the master timetable changes."
                          : "Версия 28.08 — добавлены кабинеты. Действует с 1 сентября; при изменениях мастер-расписания страница обновляется.";
  const st = document.getElementById("staffNote");
  if(st) st.innerHTML = L
    ? "<b>Y2–Y3</b> — curator Olga Salnikova · assistants Pee Ann &amp; Pee Mon<br><b>Y4–Y6</b> — curator Elizaveta Khosha · assistants Pee Dee &amp; Kru Pim"
    : "<b>Y2–Y3</b> — куратор Ольга Сальникова · ассистенты Пи Энн и Пи Мон<br><b>Y4–Y6</b> — куратор Елизавета Хоша · ассистенты Пи Ди и Кру Пим";
  const home = document.getElementById("cr0");
  if(home) home.setAttribute("href", L ? "../#/en/" : "../#/");
  ["cr1","cr2","cr3"].forEach(id=>{ const el=document.getElementById(id);
    if(el){ const base = el.getAttribute("href").split("?")[0]; el.setAttribute("href", L ? base+"?lang=en" : base); }});
}
function get(d,t,c){ return DATA[d+"|"+t+"|"+c] || null; }
function trS(s){ return LANG==="en" ? (SUBJ_EN[s]||s) : s; }
function trT(t){ return LANG==="en" ? (T_EN[t]||t) : (T_RU[t]||t); }
function engLabel(subj){
  if (subj==="Английский (ядро)" || subj==="Английский (верхний)")
    return LANG==="en" ? "basic — Albina · advanced — Sam" : "начальный — Альбина · усиленный — Сэм";
  if (subj==="Английская литература")
    return LANG==="en" ? "basic — Sam · advanced — Albina" : "начальный — Сэм · усиленный — Альбина";
  return null;
}
function cellHtml(v, d, t, c){
  if (!v) return "<td></td>";
  const [subj, ts] = v;
  let cls = subj.includes("Английск") ? "eng" : (subj.includes("электив") ? "elect" : "");
  const who = engLabel(subj) || ts.map(trT).join(", ");
  const rm = RM[d+"|"+t+"|"+c];
  const rHtml = rm ? `<div class="rooms">${rm.split(" · ").map(p=>{
      const i = p.indexOf(" → ");
      return `<span class="r">${i < 0 ? trR(p) : p.slice(0,i+3) + trR(p.slice(i+3))}</span>`;
    }).join("")}</div>` : "";
  return `<td class="${cls}"><div class="s">${trS(subj)}</div><div class="t">${who}</div>${rHtml}</td>`;
}

function render(){
  const L = LANG==="en";
  let h = `<div class="controls"><button class="act" onclick="toggleLang()">${L?"RU":"EN"}</button>
           <button class="act" onclick="window.print()">🖨 ${L?"Print":"Печать"}</button></div>`;
  h += `<p class="note">${L
    ? "English runs in level groups within the stage; on Literature lessons the teachers swap levels."
    : "Английский идёт группами по уровню внутри подступени; на литературе педагоги уровней меняются местами. Обед: младшие 11:55–12:25 (самостоятельная работа 12:25–13:10), старшие 12:50–13:20 (самостоятельная работа 13:20–14:05); самостоятельную работу ведут оба куратора (Ольга С. + Елизавета)."}</p>`;
  for (const c of CLASSES){
    h += `<h2>${c}</h2><div class="wrap"><table><tr><th class="timecol">${L?"Lesson · time":"Урок · время"}</th>` +
         DAYS.map((x,i)=>`<th>${L?DAYS_EN[i]:x}</th>`).join("") + "</tr>";
    slots(c).forEach((t,i)=>{
      h += `<tr><td class="timecol">${i+1} · ${TL[t]}</td>`;
      for (let d=0; d<5; d++) h += cellHtml(get(d,t,c), d, t, c);
      h += "</tr>";
    });
    h += "</table></div>";
    // выкладка по классу: какие предметы кто ведёт и по скольку уроков в неделю
    const agg = {};
    for (const t of slots(c)) for (let d = 0; d < 5; d++){
      const v = get(d, t, c); if (!v) continue;
      const key = v[0] + "||" + v[1].join("+");
      agg[key] = (agg[key] || 0) + 1;
    }
    const srows = Object.keys(agg).map(k => {
      const [s, w] = k.split("||"); return [s, w, agg[k]];
    }).sort((a,b) => b[2]-a[2] || a[0].localeCompare(b[0]));
    const total = srows.reduce((n,r) => n + r[2], 0);
    h += `<h2>${c} — ${L?"subjects & hours":"предметы и часы"}</h2><table style="max-width:640px">` +
         `<tr><th>${L?"Subject":"Предмет"}</th><th>${L?"Teacher":"Ведёт"}</th><th style="text-align:right">${L?"Lessons/week":"Уроков/нед"}</th></tr>` +
         srows.map(([s,w,n]) =>
           `<tr><td>${trS(s)}</td><td>${engLabel(s) || w.split("+").map(trT).join(", ")}</td><td style="text-align:right">${n}</td></tr>`).join("") +
         `<tr><th colspan="2">${L?"Total":"Всего"}</th><th style="text-align:right">${total}</th></tr></table>`;
  }
  document.getElementById("content").innerHTML = h;
}
function toggleLang(){ LANG = LANG==="ru" ? "en" : "ru"; applyChrome(); render(); }
applyChrome();
render();
