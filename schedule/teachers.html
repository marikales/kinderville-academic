    if(el){ const base = el.getAttribute("href").split("?")[0]; el.setAttribute("href", L ? base+"?lang=en" : base); }});
}
function get(d,t,c){ return DATA[d+"|"+t+"|"+c] || null; }
function trS(s){ return LANG==="en" ? (SUBJ_EN[s]||s) : s; }
function trT(t){ return LANG==="en" ? (T_EN[t]||t) : (T_RU[t]||t); }
function engLabel(subj){
  if (subj==="Английский (ядро)" || subj==="Английский (верхний)")
    return LANG==="en" ? "basic — Albina · advanced — Sam" : "начальный — Альбина · усиленный — Сэм";
  if (subj==="Английская литература")
    return LANG==="en" ? "basic — Sam · advanced — Albina" : "начальный — Сэм · усиленный — Альбина";
  return null;
}
function cellHtml(v){
  if (!v) return "<td></td>";
  const [subj, ts] = v;
  let cls = subj.includes("Английск") ? "eng" : (subj.includes("электив") ? "elect" : "");
  const who = engLabel(subj) || ts.map(trT).join(", ");
  return `<td class="${cls}"><div class="s">${trS(subj)}</div><div class="t">${who}</div></td>`;
}

const teachers = {};
for (const k in DATA){
  const [d,t,c] = k.split("|");
  for (const tch of DATA[k][1]){
    teachers[tch] = teachers[tch] || {};
    const kk = d+"|"+t;
    teachers[tch][kk] = teachers[tch][kk] || {subj: DATA[k][0], cls: []};
    teachers[tch][kk].cls.push(c);
  }
}
const names = Object.keys(teachers).sort((a,b)=>
  Object.keys(teachers[b]).length - Object.keys(teachers[a]).length);
let CUR = 0;
function render(){
  const L = LANG==="en";
  const name = names[CUR];
  const sch = teachers[name];
  const ORDER = ["1","2","3","4U","LUNCH","4L","5","6"];
  const LBL = {"1":"1 · 9:05","2":"2 · 10:05","3":"3 · 11:05",
    "4U": (L?"4 (upper) · 12:00–12:50":"4 (ст.) · 12:00–12:50"), "4L": (L?"4 (lower) · 13:15–14:05":"4 (мл.) · 13:15–14:05"),
    "5":"5 · 14:10","6":"6 · 15:10"};
  let h = `<div class="controls"><label>${L?"Teacher":"Педагог"}: <select id="selT"></select></label>
           <button class="act" onclick="window.print()">🖨 ${L?"Print":"Печать"}</button>
           <button class="act" onclick="toggleLang()">${L?"RU":"EN"}</button></div>`;
  h += `<h2>${L?(T_EN[name]||name):(T_RU[name]||name)} — ${Object.keys(sch).length} ${L?"h/week":"ч/нед"}</h2>`;
  const busyDay = DAYS.map((x,i)=> Object.keys(sch).some(k=>k.startsWith(i+"|")));
  h += `<table style="table-layout:fixed"><colgroup><col style="width:130px">` +
       `<col span="5"></colgroup><tr><th class="timecol">${L?"Slot":"Слот"}</th>` +
       DAYS.map((x,i)=>`<th>${L?DAYS_EN[i]:x}${busyDay[i]?"":(L?" · free":" · свободен")}</th>`).join("") + "</tr>";
  const isCurLower = name === "Ольга Сальникова", isCurUpper = name === "Лиза";
  for (const t of ORDER){
    if (t === "4U" && (isCurLower || isCurUpper)){
      const own = isCurLower
        ? (L?"lunch & homework of the lower stage — own group (11:55–13:10), then supporting Elizaveta with the upper stage (till 14:05)"
           :"обед и домашняя работа младших — со своими (11:55–13:10), затем на подхвате у Елизаветы со старшими (до 14:05)")
        : (L?"supporting Olga S. with the lower stage (11:55–13:10), then lunch & homework of the upper stage — own group (12:50–14:05)"
           :"на подхвате у Ольги С. с младшими (11:55–13:10), затем обед и домашняя работа старших — со своими (12:50–14:05)");
      h += `<tr><td class="timecol">11:55–14:05</td><td class="brk" colspan="5">${own}</td></tr>`;
      continue;
    }
    if (t === "4L" && (isCurLower || isCurUpper)) continue;
    if (t === "LUNCH"){
      if (isCurLower || isCurUpper) continue;
      h += `<tr><td class="timecol">${L?"Lunch":"Обед"} · 12:50–13:15</td><td class="brk" colspan="5">${L?"lunch break — 25 minutes":"обеденный перерыв — 25 минут"}</td></tr>`;
      continue;
    }
    h += `<tr><td class="timecol">${LBL[t]}</td>`;
    for (let d=0; d<5; d++){
      const v = sch[d+"|"+t];
      if (v){
        let cls = v.subj.includes("Английск") ? "eng" : (v.subj.includes("электив") ? "elect" : "");
        h += `<td class="${cls}"><div class="s">${trS(v.subj)}</div><div class="t">${v.cls.join(" + ")}</div></td>`;
      } else h += "<td></td>";
    }
    h += "</tr>";
  }
  h += "</table>";
  // выкладка: какие предметы ведёт педагог и по скольку уроков в неделю
  const agg = {};
  for (const kk in sch){
    const v = sch[kk];
    const key = v.subj + "||" + v.cls.slice().sort().join(" + ");
    agg[key] = (agg[key] || 0) + 1;
  }
  const srows = Object.keys(agg).map(k => { const [s,c] = k.split("||"); return [s,c,agg[k]]; })
    .sort((a,b)=> b[2]-a[2] || a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]));
  h += `<h2>${L?"Subjects & hours":"Предметы и часы"}</h2><table style="max-width:560px">` +
       `<tr><th>${L?"Subject":"Предмет"}</th><th>${L?"Class":"Класс"}</th><th style="text-align:right">${L?"Lessons/week":"Уроков/нед"}</th></tr>` +
       srows.map(([s,c,n]) =>
         `<tr><td>${trS(s)}</td><td>${c}</td><td style="text-align:right">${n}</td></tr>`).join("") +
       `<tr><th colspan="2">${L?"Total":"Всего"}</th><th style="text-align:right">${Object.keys(sch).length}</th></tr></table>`;
  if (isCurLower || isCurUpper)
    h += `<p class="note">${L?"Also: Circle Time 8:45–9:00 daily (whole stage), curators meet at 8:15.":"Плюс ежедневно: утренний круг 8:45–9:00 всем потоком, встреча кураторов в 8:15."}</p>`;
  document.getElementById("content").innerHTML = h;
  const sel = document.getElementById("selT");
  names.forEach(n=>{ const o=document.createElement("option");
    o.text = (L?(T_EN[n]||n):(T_RU[n]||n)) + " — " + Object.keys(teachers[n]).length; sel.add(o); });
  sel.selectedIndex = CUR;
  sel.onchange = () => { CUR = sel.selectedIndex; render(); };
}
function toggleLang(){ LANG = LANG==="ru" ? "en" : "ru"; applyChrome(); render(); }
applyChrome();
render();

</script></body></html>
