nav.crumbs { padding:10px 22px 0; font-size:13.5px; } nav.crumbs a { color:var(--petrol); }
main { padding:12px 22px 40px; }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0 4px; }

button.act { background:var(--petrol); color:#fff; border-color:var(--petrol); }

.r { font-size:11px; font-weight:600; letter-spacing:.02em; color:#7a5a1e;

display:inline-block; white-space:nowrap; }
td.eng { background:#e9f1fb; } td.elect { background:#ecf6e8; }

.card { padding:6px 8px; }
.card + .card { border-top:1px dashed #a9c1de; }
td.brk { background:#fbf6ea; color:#8a7a55; font-size:12.5px; }

.note { color:#5b7a7d; font-size:13px; margin:4px 0 8px; max-width:900px; }
.timecol { white-space:nowrap; font-size:12.5px; color:#4a6b6e; }

.tm { font-size:11px; color:#7a8f92; margin-bottom:2px; } td.eng2 .tm { padding:4px 8px 0; margin:0; }
.draft { background:#fff3d6; border:1px solid #e8d49a; border-radius:8px; padding:6px 12px;

.wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0 26px; }
.wrap table { margin:0; }

// Порядок: группа A выше B/C.
function engCards(subj, ts, cls, d, t){
  return ts.map(tch => { const g = engGroup(subj, tch, cls); const r = RT[tch+"|"+d+"|"+t];
      return [g ? g.code : "~" + tch,
        `<div class="card"><div class="s">${engSubj(subj, [tch], cls)}</div>` +
        `<div class="t">${trT(tch)}${g ? " — " + engText(g) : ""}</div>${roomLine(r)}</div>`]; })
    .sort((a, b) => a[0].localeCompare(b[0])).map(x => x[1]).join("");
}
function cellHtml(v, d, t, c){
  if (!v) return "<td></td>";
  const [subj, ts] = v;
  let cls = subj.includes("Английск") ? "eng" : (subj.includes("электив") ? "elect" : "");
  if (isEng(subj) && ts.length > 1) return `<td class="eng eng2">${engCards(subj, ts, [c], d, t)}</td>`;
  const who = engLabel(subj, ts, [c]) || ts.map(trT).join(", ");
  return `<td class="${cls}"><div class="s">${engSubj(subj, ts, [c])}</div><div class="t">${who}</div>${roomsHtml(RM[d+"|"+t+"|"+c])}</td>`;
}
// Одна ячейка на несколько классов (полоса английского, Soft Skills, элективы,
// склейки Y5+Y6). У английского с двумя педагогами — две группы построчно:
// группа · педагог · учебник · кабинет — чтобы было видно, что это две группы,
// а не один урок, повторённый в каждой клетке (Марика 16.09).
function spanHtml(v, d, t, cls){
  const [subj, ts] = v;
  const kind = subj.includes("Английск") ? "eng" : (subj.includes("электив") ? "elect" : "");
  let body;
  if (isEng(subj) && ts.length > 1){
    return `<td class="eng eng2" colspan="${cls.length}">${engCards(subj, ts, cls, d, t)}</td>`;
  } else {
    body = `<div class="s">${engSubj(subj, ts, cls)}</div><div class="t">${ts.map(trT).join(", ")}</div>` + roomsHtml(RM[d+"|"+t+"|"+cls[0]]);
  }
  return `<td class="${kind}" colspan="${cls.length}">${body}</td>`;
}

function render(){
  const d = document.getElementById("selD").selectedIndex;
  const brk = (txt) => `<td class="brk">${txt}</td>`;
  const L = LANG==="en";
  const rows = [
    [L?"8:20–8:30":"8:20–8:30", "TXT", L?"Wake up (optional)":"Wake up (для тех, кто уже пришёл)"],
    [L?"8:45–9:00":"8:45–9:00", "TXT", L?"Circle Time — curators, each with their own stage":"Утренний круг — кураторы по своим ступеням"],
    ["9:05–9:55","1","1"], ["10:05–10:55","2","2"], ["11:05–11:55","3","3"],
    // Зона обеда 11:55–14:05: у ступеней разные границы, поэтому строки оси —
    // интервалы между ВСЕМИ границами обоих потоков (без наложений), а клетки
    // тянутся rowspan'ом по своим сегментам (Марика 16.09: «в столбце времени
    // ячейки с пересечением друг друга»).
    ["ZONE"],
    ["14:10–15:00","5","5"],
    ["15:00–15:10","TXT", L?"Snack":"Полдник"],
    ["15:10–16:00","6","6"],
    ["16:05–16:20","TXT", MEET.some(m => m.day === d && m.cover)
      ? (L?"Reflection — at the end of prep on circle days; here the assistants take over":
           "Рефлексия — в дни кругов проходит в конце самостоятельной работы, здесь детей принимают ассистенты")
      : (L?"Reflection":"Рефлексия")],
  ];
  let h = `<h2>${L?DAYS_EN[d]:DAYS[d]}</h2><div class="wrap"><table><tr><th class="timecol">${L?"Time":"Время"}</th>` +
          CLASSES.map(c=>`<th>${c}</th>`).join("") + "</tr>";
  const UPPER = CLASSES.filter(c => !LOWER.includes(c));
  // уроки ступени: соседние классы с одинаковым уроком (предмет + педагоги)
  // рисуются одной ячейкой — полоса английского, Soft Skills, элективы, склейки
  const stageCells = (code, stage) => {
    let out = "";
    for (let i = 0; i < stage.length; ){
      const c = stage[i], v = get(d, code, c);
      let n = 1;
      if (v) while (i + n < stage.length && JSON.stringify(get(d, code, stage[i+n])) === JSON.stringify(v)) n++;
      out += n === 1 ? cellHtml(v, d, code, c) : spanHtml(v, d, code, stage.slice(i, i+n));
      i += n;
    }
    return out;
  };
  // обед + самостоятельная работа одной ячейкой на ступень; кабинеты — по классам
  const block = (low, span) => {
    const stage = low ? LOWER : UPPER;
    const byRoom = {}; stage.forEach(c => { (byRoom[HWR[c]] = byRoom[HWR[c]] || []).push(c); });
    const rooms = Object.entries(byRoom).map(([r, cs]) => `<span class="r">${cs.join(", ")} — ${trR(r)}</span>`).join("");
    return `<td class="brk blk" colspan="${stage.length}" rowspan="${span}">` +
      `<div class="bl"><b>${L?"Lunch":"Обед"}</b> · ${low ? "11:55–12:25" : "12:50–13:20"}</div>` +
      `<div class="bl"><b>${L?"Prep":"Самостоятельная работа"}</b> · ${low ? "12:25–13:10" : "13:20–14:05"}</div>` +
      `<div class="t">${L?"Olga S. + Elizaveta":"Ольга С. + Елизавета"}</div><div class="rooms">${rooms}</div></td>`;
  };
  // высота строки пропорциональна минутам — иначе 5-минутная строка и урок равны
  const toM = x => { const [hh, mm] = x.split(":").map(Number); return hh*60 + mm; };
  const tcell = (a, b) => `<td class="timecol" style="height:${Math.round((toM(b)-toM(a))*1.3)}px">${a}–${b}</td>`;
  // сегменты зоны обеда: [начало, конец, что]; BLOCK = обед + самостоятельная одной клеткой
  // Пятиминутные переменки (11:55–12:00 у старших, 13:10–13:15 у младших) в ось НЕ входят —
  // как и везде в сетке (Марика 17.09). Урок 4 прижат к соседней границе, а его настоящее
  // время стоит подписью внутри клетки (4-й элемент сегмента).
  const ZL = [["11:55","13:10","BLOCK"], ["13:10","14:05","4L","13:15–14:05"]];
  const ZU = [["11:55","12:50","4U","12:00–12:50"], ["12:50","14:05","BLOCK"]];
  const ZB = ["11:55","12:25","12:50","13:10","13:20","14:05"];   // границы обеда/самостоятельной обоих потоков
  const zone = () => {
    let z = "";
    for (let i = 0; i < ZB.length - 1; i++){
      z += "<tr>" + tcell(ZB[i], ZB[i+1]);
      for (const [segs, stage, low] of [[ZL, LOWER, true], [ZU, UPPER, false]]){
        const cov = segs.find(sg => toM(sg[0]) <= toM(ZB[i]) && toM(ZB[i]) < toM(sg[1]));
        if (!cov){ z += `<td colspan="${stage.length}"></td>`; continue; }
        if (cov[0] !== ZB[i]) continue;                   // строка внутри rowspan'а
        const span = ZB.filter(b => toM(cov[0]) <= toM(b) && toM(b) < toM(cov[1])).length;
        if (cov[2] === "BLOCK") z += block(low, span);
        else z += stageCells(cov[2], stage).replace(/<td([^>]*)>/g,
               `<td$1 rowspan="${span}"><div class="tm">${cov[3] || (cov[0] + "–" + cov[1])}</div>`);
      }
      z += "</tr>";
    }
    return z;
  };
  for (const r of rows){
    const [time, lo, up] = r;
    if (time === "ZONE"){ h += zone(); continue; }
    h += "<tr>" + tcell(...time.split("–"));
    if (lo === "TXT"){ h += `<td class="brk" colspan="6">${up}</td></tr>`; continue; }
    for (const [code, stage] of [[lo, LOWER], [up, UPPER]]) h += stageCells(code, stage);
    h += "</tr>";
  }
  h += "</table></div>";
  // круги команды в этот день
  const md = MEET.filter(m => m.day === d).sort((a,b)=> a.time.localeCompare(b.time));
  if (md.length){
    h += `<h2>${L?"Team circles this day":"Круги команды в этот день"}</h2><table style="max-width:760px">` +
         `<tr><th style="width:120px">${L?"Time":"Время"}</th><th style="width:190px">${L?"Circle":"Круг"}</th>` +
         `<th>${L?"Who":"Кто"}</th><th style="width:130px">${L?"How often":"Как часто"}</th></tr>` +
         md.map(m => `<tr><td>${m.time}</td><td class="circle" style="border-left-width:3px"><span class="cn">${L?m.name_en:m.name}</span></td>` +
           `<td>${m.who.map(w=> (L?(T_EN[w]||w):(T_RU[w]||w)) + (w === "Марика" ? (L?" (opt)":" (опц)") : "")).join(", ")}</td>` +
           `<td>${L?m.freq_en:m.freq}</td></tr>`).join("") + "</table>";
    const cov = md.find(m => m.cover);
    if (cov) h += `<p class="note">${L?cov.cover_en:cov.cover}.</p>`;
  }
  h += `<p class="note">${L
    ? "Before lessons: 8:00–8:45 breakfast & play · 8:15 curators meet the day · first Monday of each month 8:00–8:40 staff meeting (assistants until 8:30, then they meet the children)."
    : "До уроков: 8:00–8:45 завтрак и игры · 8:15 — встреча кураторов · в первый понедельник месяца 8:00–8:40 сбор педагогов (до 8:30 вместе с ассистентами, дальше ассистенты — на приёме детей)."}</p>`;
  document.getElementById("content").innerHTML =
    `<div class="controls"><label>${L?"Day":"День"}: <select id="selD2"></select></label>
     <button class="act" onclick="printEN()">🖨 ${L?"Print":"Печать"} (EN)</button>
     <button class="act" onclick="toggleLang()">${L?"RU":"EN"}</button></div>` + h;
  const sel2 = document.getElementById("selD2");
  DAYS.forEach((x,i)=>{ const o=document.createElement("option");
    o.text = L?DAYS_EN[i]:x; sel2.add(o); });
  sel2.selectedIndex = d;
  sel2.onchange = () => { document.getElementById("selD").selectedIndex = sel2.selectedIndex; render(); };
}
function toggleLang(){ LANG = LANG==="ru" ? "en" : "ru"; applyChrome(); render(); }
function printEN(){ const old = LANG; LANG = "en"; applyChrome(); render(); window.print(); LANG = old; applyChrome(); render(); }
// скрытый селектор-состояние
const hidden = document.createElement("select"); hidden.id = "selD"; hidden.style.display = "none";
DAYS.forEach(x=>{ const o=document.createElement("option"); o.text=x; hidden.add(o); });
document.body.appendChild(hidden);
// день по умолчанию: сегодня (Пн после Пт/выходных)
const wd = new Date().getDay(); hidden.selectedIndex = (wd >= 1 && wd <= 5) ? wd - 1 : 0;
applyChrome();
render();

</script></body></html>
