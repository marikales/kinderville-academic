<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание сада</title><style>
:root { --ink:#1a3c40; --petrol:#0f6b70; --soft:#e8f2f2; --line:#d5e2e2; --mut:#5b7a7d; }
* { box-sizing:border-box; }
body { font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); margin:0; background:#fafcfc; }
header { background:var(--petrol); color:#fff; padding:12px 22px; }
header h1 { font-size:17px; margin:0; font-weight:600; display:inline; color:#e9f0ef; letter-spacing:.02em; }
header .sub { color:#c7d8d7; font-size:12.5px; margin-left:10px; }
nav.crumbs { padding:10px 22px 0; font-size:13.5px; } nav.crumbs a { color:var(--petrol); }
main { padding:12px 22px 40px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0 4px; }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg button, select, button.act { font-size:14px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
.seg button.on { background:var(--soft); border-color:var(--petrol); color:var(--petrol); font-weight:600; }
button.act { background:var(--petrol); color:#fff; border-color:var(--petrol); }
button.ghost { background:#fff; color:var(--petrol); border-color:var(--petrol); }
.wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:12px 0 22px; }
table { border-collapse:collapse; width:100%; max-width:1200px; table-layout:fixed; }
th, td { border:1px solid var(--line); padding:5px 7px; vertical-align:middle; text-align:center; }
th { background:var(--soft); font-weight:600; font-size:13px; }
th.timecol, td.timecol { width:66px; white-space:nowrap; font-size:12.5px; color:#4a6b6e; }
td .s { font-weight:600; font-size:13.5px; line-height:1.25; }
td .w { font-size:12px; color:#4a6b6e; margin-top:1px; }
td .tm { font-size:11px; color:#7a8f92; }
td.rt { background:#f6f8f8; color:var(--mut); font-size:12.5px; }
td.rt.meal { background:#fbf6ea; color:#8a7a55; }
td.rt.rest { background:#eef1f8; color:#5d6a8a; }
td.k-ru { background:#fff; }
td.k-en { background:#e9f1fb; }
td.k-move { background:#ecf6e8; }
td.k-art { background:#f6effa; }
td.k-play { background:#fdf8ec; }
td.empty { background:#fff; }
td.off { background:repeating-linear-gradient(135deg,#f4f6f6,#f4f6f6 6px,#fbfcfc 6px,#fbfcfc 12px); color:#a3b3b5; font-size:12px; }
td.duty { background:#eef1f8; color:#4d5a7a; }
h2 { font-size:16px; margin:18px 0 2px; }
.note { color:var(--mut); font-size:13px; margin:4px 0 8px; max-width:900px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--mut); margin:6px 0; }
.legend i { display:inline-block; width:14px; height:14px; border:1px solid var(--line); border-radius:3px; vertical-align:-3px; margin-right:5px; }
.staff { background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13.5px; margin:8px 0 4px; max-width:900px; }
.staff b { color:var(--petrol); }
.draft { background:#fff3d6; border:1px solid #e8d49a; border-radius:8px; padding:6px 12px; font-size:13px; margin:8px 0; max-width:900px; }
.lang { float:right; color:#fff; text-decoration:none; font-size:13px; border:1px solid rgba(255,255,255,.5); border-radius:14px; padding:2px 12px; }
@media (max-width:720px) {
  header { padding:10px 14px; } nav.crumbs { padding:8px 14px 0; } main { padding:10px 14px 32px; }
  table { table-layout:auto; min-width:640px; }
  th, td { padding:4px 5px; } td .s { font-size:12.5px; }
  th.timecol, td.timecol { position:sticky; left:0; z-index:1; background:#fafcfc; box-shadow:2px 0 0 var(--line); }
  th.timecol { background:var(--soft); }
}
@page { size:A4 landscape; margin:8mm; }
@media print {
  nav.crumbs, .controls, .draft, .lang, .noprint { display:none !important; }
  header { background:#fff !important; padding:0 0 4px; }
  header h1 { color:#000 !important; font-size:14px; } header .sub { color:#555 !important; }
  body { background:#fff !important; } main { padding:0; }
  .wrap { overflow:visible; margin:2px 0 4px; }
  table { font-size:10px; max-width:100%; min-width:0; page-break-inside:avoid; break-inside:avoid; }
  th, td { padding:2px 4px; } th { font-size:10px; }
  td .s { font-size:10.5px; } td .w { font-size:9px; } td .tm { font-size:8.5px; }
  td.rt { font-size:9.5px; } th.timecol, td.timecol { font-size:9px; width:48px; }
  .sect { page-break-before:always; break-before:page; }
  .sect:first-child { page-break-before:auto; break-before:auto; }
  h2 { font-size:13px; margin:0 0 3px; }
  .legend { font-size:9px; margin:2px 0; } .staff { font-size:9.5px; padding:3px 8px; margin:3px 0; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

 {"L1": {"s": "Math", "who": "Юлия"}, "L2": {"s": "Lit", "who": "Юлия"}, "L3": {"s": "Eng", "who": "Сиппи"}, "L4": {"s": "Swim", "who": "Алекс"}, "L5": {"s": "Role", "who": null}}, "1": {"L1": {"s": "Doh", "who": "Пи Нат"}, "L2": {"s": "Art", "who": "Пи Нат"}, "L3": {"s": "RSD", "who": "Маргарита"}, "L4": {"s": "Fit", "who": "Сиппи"}, "L5": {"s": "Story", "who": "Сиппи"}}, "2": {"L1": {"s": "Eng", "who": "Сиппи"}, "L2": {"s": "RRC", "who": "Юлия"}, "L3": {"s": "Music", "who": "Анастасия"}, "L4": {"s": "Swim", "who": "Алекс"}, "L5": {"s": "Nature", "who": "Юлия"}}, "3": {"L1": {"s": "Fit", "who": "Сиппи"}, "L2": {"s": "Lit", "who": "Юлия"}, "L3": {"s": "Soft", "who": "Дарья"}, "L4": {"s": "Neuro", "who": null}, "L5": {"s": "Story", "who": "Сиппи"}}, "4": {"L1": {"s": "RRC", "who": "Юлия"}, "L2": {"s": "Art", "who": "Пи Нат"}, "L3": {"s": "Swim", "who": "Алекс"}, "L4": {"s": "Sand", "who": null}, "L5": {"s": "Role", "who": null}}}, "Y1": {"0": {"L1": {"s": "Soft", "who": "Дарья"}, "L2": {"s": "Art", "who": "Пи Нат"}, "L3": {"s": "Swim", "who": "Алекс"}, "L4": {"s": "Role", "who": null}, "L5": {"s": "Story", "who": "Сиппи"}}, "1": {"L1": {"s": "RRC", "who": "Юлия"}, "L2": {"s": "Lit", "who": "Юлия"}, "L3": {"s": "Fit", "who": "Сиппи"}, "L4": {"s": "RSD", "who": "Маргарита"}, "L5": {"s": "Neuro", "who": null}}, "2": {"L1": {"s": "Math", "who": "Юлия"}, "L2": {"s": "Eng", "who": "Сиппи"}, "L3": {"s": "Swim", "who": "Алекс"}, "L4": {"s": "Music", "who": "Анастасия"}, "L5": {"s": "Story", "who": "Сиппи"}}, "3": {"L1": {"s": "RRC", "who": "Юлия"}, "L2": {"s": "Thai", "who": "Пи Ай"}, "L3": {"s": "MathEn", "who": "Сиппи"}, "L4": {"s": "Fit", "who": "Сиппи"}, "L5": {"s": "Nature", "who": "Юлия"}}, "4": {"L1": {"s": "Doh", "who": "Пи Нат"}, "L2": {"s": "Lit", "who": "Юлия"}, "L3": {"s": "Eng", "who": "Сиппи"}, "L4": {"s": "Swim", "who": "Алекс"}, "L5": {"s": "Math", "who": "Юлия"}}}}, "subj": {"Math": ["Математика", "Math", "ru"], "MathEn": ["Математика (англ.)", "Math (English)", "en"], "RSD": ["Развитие речи", "Speech Development (Rus)", "ru"], "Nature": ["Природа", "Nature", "ru"], "Lit": ["Литература", "Literature", "ru"], "LitEn": ["Литература (англ.)", "Literature (English)", "en"], "RRC": ["Грамота", "Russian Literacy", "ru"], "Eng": ["Английский", "English", "en"], "Story": ["Storytelling", "Storytelling", "en"], "Dance": ["Танцы", "Dance", "move"], "Fit": ["Йога и фитнес", "Fitness & Yoga", "en"], "Swim": ["Плавание", "Swimming", "move"], "Music": ["Музыка", "Music", "art"], "Art": ["ИЗО", "Art", "art"], "Doh": ["Лепка", "Modelling", "art"], "Thai": ["Тайская культура", "Thai Culture", "art"], "Soft": ["Soft Skills", "Soft Skills", "play"], "Sand": ["Песочница", "Sand Play", "play"], "Role": ["Сюжетная игра", "Role Play", "play"], "Neuro": ["Нейроигры", "Neurogames", "play"]}, "routine": {"arrive": ["Встреча детей, завтрак, игры", "Arrival, breakfast, play"], "circle": ["Утренний круг", "Circle Time"], "vegsnack": ["Перекус из овощей", "Veg snack"], "lunch": ["Обед", "Lunch"], "napprep": ["Подготовка ко сну", "Nap preparation"], "nap": ["Дневной сон", "Nap time"], "snack": ["Полдник", "Snack"], "meditation": ["Медитация и тихий отдых", "Meditation & quiet rest"], "playground": ["Площадка", "Playground"], "fruits": ["Фрукты", "Fruits"], "bye": ["Игры и проводы домой", "Play & going home"]}, "en": {"Дарья": "Darya", "Юлия": "Yulia", "Анастасия": "Anastasia", "Маргарита": "Margarita", "Алекс": "Alex", "Сиппи": "Sippi", "Пи Нат": "Pee Nat", "Пи Ай": "Pee Ai", "Пи Иу": "Pee Iu", "Пи Парн": "Pee Parn", "Тренер": "Coach"}, "duties": [["Юлия", "11:30", "14:00", "nap"], ["Пи Парн", "11:30", "14:00", "nap"], ["Пи Иу", "11:30", "14:00", "nap"], ["Сиппи", "13:10", "14:40", "meditation"], ["Пи Ай", "13:10", "14:40", "meditation"]], "breaks": {"Пи Парн": ["11:45", "12:30"], "Юлия": ["12:30", "13:30"], "Пи Иу": ["13:15", "14:00"], "Сиппи": ["13:40", "14:40"]}, "duty": {"nap": ["Спальня младших (PS, EY)", "Nap room (PS, EY)"], "meditation": ["М <script>
const Q = new URLSearchParams(location.search);
const EN = Q.get('lang') === 'en';
const I = EN ? 1 : 0;
const TX = {
  portal: ['← Портал педагогов', '← Teachers\' portal'],
  sub: ['Сад · Раваи · 2026/27 · проект от 18 ноября', 'Kindergarten · Rawai · 2026/27 · draft of 18 November'],
  day: ['Расписание сада · день', 'Kindergarten timetable · day'],
  groups: ['Расписание сада · по группам', 'Kindergarten timetable · by group'],
  teachers: ['Расписание сада · по педагогам', 'Kindergarten timetable · by teacher'],
  nav_day: ['День', 'Day'], nav_groups: ['По группам', 'By group'], nav_teachers: ['По педагогам', 'By teacher'],
  print: ['Печать', 'Print'], printAll: ['Печать: все', 'Print: all'],
  allDays: ['Вся неделя', 'Whole week'], all: ['Все', 'All'],
  time: ['Время', 'Time'], assist: ['с ассистентами', 'with assistants'],
  lessons: ['уроков в неделю', 'lessons a week'], works: ['В школе', 'On site'],
  notHere: ['нет в саду', 'off site'], brk: ['перерыв', 'break'],
  legend: [['Русский язык', 'На английском', 'Движение', 'Творчество', 'Игра и развитие', 'Режим'],
           ['Russian', 'In English', 'Movement', 'Arts', 'Play & development', 'Routine']],
  adults: ['Взрослые в тихий час', 'Adults during rest time'],
  langLink: ['English', 'Русский'],
};
const tx = k => TX[k][I];
const nm = n => EN ? (D.en[n] || n) : n;
const sn = c => D.subj[c][I];
const rn = c => D.routine[c][I];
const mm = s => { const [h, m] = s.split(':'); return +h * 60 + +m; };
const hhmm = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chrome(page) {
  document.documentElement.lang = EN ? 'en' : 'ru';
  document.title = tx(page);
  document.getElementById('pageTitle').textContent = tx(page);
  document.getElementById('sub').textContent = tx('sub');
  const ll = document.getElementById('langLink');
  const u = new URL(location.href);
  if (EN) u.searchParams.delete('lang'); else u.searchParams.set('lang', 'en');
  ll.href = u.toString(); ll.textContent = TX.langLink[I];
  const q = EN ? '?lang=en' : '';
  document.getElementById('crumbs').innerHTML =
    `<a href="../${EN ? '#/en/' : '#/'}">${tx('portal')}</a> · ` +
    ['day', 'groups', 'teachers'].map(p => p === page ? `<b>${tx('nav_' + p)}</b>`
      : `<a href="${p}.html${q}">${tx('nav_' + p)}</a>`).join(' · ');
}

function legend() {
  const cls = ['k-ru', 'k-en', 'k-move', 'k-art', 'k-play', 'rt'];
  const col = {'k-ru': '#fff', 'k-en': '#e9f1fb', 'k-move': '#ecf6e8', 'k-art': '#f6effa', 'k-play': '#fdf8ec', 'rt': '#f6f8f8'};
  return '<div class="legend">' + TX.legend[I].map((l, i) => `<span><i style="background:${col[cls[i]]}"></i>${l}</span>`).join('') + '</div>';
}

function rtClass(c) {
  if (['vegsnack', 'lunch', 'snack', 'fruits'].includes(c)) return 'rt meal';
  if (['nap', 'napprep', 'meditation'].includes(c)) return 'rt rest';
  return 'rt';
}

// содержимое клетки урока
function lessonCell(cell, a, b, withTime) {
  const k = D.subj[cell.s][2];
  const w = cell.who ? nm(cell.who) : tx('assist');
  return [`k-${k}`, (withTime ? `<div class="tm">${a}–${b}</div>` : '') +
    `<div class="s">${esc(sn(cell.s))}</div><div class="w">${esc(w)}</div>`];
}

function blocksOf(g, d) {
  return D.frame[D.stream[g]].map(f => ({...f, cell: f.k === 'lesson' ? D.grid[g][d][f.c] : null}));
}

/* ---------- ДЕНЬ ---------- */
function dayTable(d) {
  const gs = D.groups;
  const B = {}; gs.forEach(g => B[g] = blocksOf(g, d));
  const pts = [...new Set(gs.flatMap(g => B[g].map(b => mm(b.a))))].sort((x, y) => x - y);
  const endAll = mm('17:00');
  const idx = p => pts.indexOf(p);
  // для каждой группы: в какой строке начинается блок и сколько строк занимает
  const start = {}; gs.forEach(g => { start[g] = {}; B[g].forEach(b => {
    const r0 = idx(mm(b.a)), r1 = b.n === '17:00' ? pts.length : idx(mm(b.n));
    start[g][r0] = {...b, span: r1 - r0}; }); });
  let h = `<table><colgroup><col style="width:66px">${gs.map(() => '<col>').join('')}</colgroup>`;
  h += `<thead><tr><th class="timecol">${tx('time')}</th>${gs.map(g => `<th>${D.gname[g]}</th>`).join('')}</tr></thead><tbody>`;
  for (let r = 0; r < pts.length; r++) {
    h += `<tr><td class="timecol">${hhmm(pts[r])}</td>`;
    for (let i = 0; i < gs.length; i++) {
      const b = start[gs[i]][r];
      if (!b) continue;
      if (b.k === 'routine') {
        // склейка одинаковых режимных блоков соседних групп
        let cs = 1;
        while (i + cs < gs.length) {
          const o = start[gs[i + cs]][r];
          if (o && o.k === 'routine' && o.c === b.c && o.span === b.span && o.b === b.b) cs++; else break;
        }
        h += `<td class="${rtClass(b.c)}" rowspan="${b.span}" colspan="${cs}"><div class="tm">${b.a}–${b.b}</div>${esc(rn(b.c))}</td>`;
        i += cs - 1;
      } else {
        const [cls, html] = lessonCell(b.cell, b.a, b.b, true);
        h += `<td class="${cls}" rowspan="${b.span}">${html}</td>`;
      }
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  // кто с детьми в тихий час
  const ad = D.duties.reduce((o, [w, a, b, c]) => { (o[c] = o[c] || []).push(nm(w)); return o; }, {});
  const tim = {}; D.duties.forEach(([w, a, b, c]) => tim[c] = `${a}–${b}`);
  h += `<div class="staff"><b>${tx('adults')}:</b> ` + Object.keys(ad).map(c =>
    `${D.duty[c][I]} ${tim[c]} — ${ad[c].join(', ')}`).join(' · ') + '</div>';
  return h;
}

/* ---------- ГРУППА ---------- */
function groupTable(g) {
  const fr = D.frame[D.stream[g]];
  let h = `<table><colgroup><col style="width:92px">${[0,1,2,3,4].map(() => '<col>').join('')}</colgroup>`;
  h += `<thead><tr><th class="timecol">${tx('time')}</th>${D.days[I].map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>`;
  fr.forEach(f => {
    h += `<tr><td class="timecol">${f.a}–${f.b}</td>`;
    if (f.k === 'routine') h += `<td class="${rtClass(f.c)}" colspan="5">${esc(rn(f.c))}</td>`;
    else for (let d = 0; d < 5; d++) {
      const [cls, html] = lessonCell(D.grid[g][d][f.c], f.a, f.b, false);
      h += `<td class="${cls}">${html}</td>`;
    }
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

/* ---------- ПЕДАГОГ ---------- */
function teacherItems(who) {
  const days = [[], [], [], [], []];
  for (let d = 0; d < 5; d++) {
    D.groups.forEach(g => blocksOf(g, d).forEach(b => {
      if (b.k === 'lesson' && b.cell.who === who) days[d].push({a: b.a, b: b.b, s: b.cell.s, g});
    }));
    D.duties.forEach(([w, a, b, c]) => { if (w === who) days[d].push({a, b, duty: c}); });
  }
  return days;
}
function teacherTable(who) {
  const days = teacherItems(who);
  const rows = [...new Set(days.flat().map(x => x.a))].sort((x, y) => mm(x) - mm(y));
  const n = days.flat().filter(x => !x.duty).length;
  const av = D.avail[who];
  let h = `<div class="staff"><b>${n}</b> ${tx('lessons')}` +
    (av ? ` · ${tx('works')}: ${av[I]}` : '') + '</div>';
  if (!rows.length) return h;
  h += `<table><colgroup><col style="width:92px">${[0,1,2,3,4].map(() => '<col>').join('')}</colgroup>`;
  h += `<thead><tr><th class="timecol">${tx('time')}</th>${D.days[I].map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>`;
  const offDay = d => av && !days[d].some(x => !x.duty) && who !== 'Пи Ай';
  rows.forEach(r => {
    const ends = days.flat().filter(x => x.a === r).map(x => x.b);
    h += `<tr><td class="timecol">${r}–${ends[0]}</td>`;
    for (let d = 0; d < 5; d++) {
      const it = days[d].find(x => x.a === r);
      if (!it) { h += offDay(d) ? `<td class="off">${tx('notHere')}</td>` : '<td class="empty"></td>'; continue; }
      if (it.duty) {
        const br = D.breaks[who];
        h += `<td class="duty"><div class="s">${esc(D.duty[it.duty][I])}</div>` +
          (br ? `<div class="w">${tx('brk')} ${br[0]}–${br[1]}</div>` : '') + '</td>';
      } else {
        const k = D.subj[it.s][2];
        h += `<td class="k-${k}"><div class="s">${esc(sn(it.s))}</div><div class="w">${D.gname[it.g]}</div></td>`;
      }
    }
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

/* ---------- каркас страницы: выбор + печать ---------- */
function mount(page) {
  chrome(page);
  const box = document.getElementById('view');
  const ctl = document.getElementById('ctl');
  let opts, render, title;
  if (page === 'day') {
    opts = D.days[I].map((x, i) => [String(i), x]);
    render = v => dayTable(+v); title = v => D.daysFull[I][+v];
  } else if (page === 'groups') {
    opts = D.groups.map(g => [g, D.gname[g]]);
    render = groupTable; title = v => D.gname[v];
  } else {
    opts = D.staff.map(s => [s, nm(s)]);
    render = teacherTable; title = v => nm(v);
  }
  const key = {day: 'd', groups: 'g', teachers: 't'}[page];
  let cur = Q.get(key);
  if (!opts.some(o => o[0] === cur)) {
    const today = new Date().getDay();
    cur = page === 'day' && today >= 1 && today <= 5 ? String(today - 1) : opts[0][0];
  }
  const show = (vals) => {
    box.innerHTML = vals.map(v => `<section class="sect"><h2>${esc(title(v))}</h2><div class="wrap">${render(v)}</div>${page !== 'teachers' ? legend() : ''}</section>`).join('');
  };
  const draw = () => {
    ctl.innerHTML = `<div class="seg">${opts.map(([v, l]) => `<button data-v="${esc(v)}" class="${v === cur ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` +
      `<button class="act" id="pr">${tx('print')}</button><button class="ghost act" id="pa">${tx('printAll')}</button>`;
    ctl.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      cur = b.dataset.v; const u = new URL(location.href); u.searchParams.set(key, cur);
      history.replaceState(null, '', u); draw();
    });
    document.getElementById('pr').onclick = () => window.print();
    document.getElementById('pa').onclick = () => { show(opts.map(o => o[0])); setTimeout(() => { window.print(); show([cur]); }, 50); };
    show([cur]);
  };
  draw();
}

mount('day');</script>
</body></html>
