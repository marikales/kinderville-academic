<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Портал педагогов Kinderville</title>
  <meta name="description" content="Методические материалы Kinderville для педагогов: программы, пояснительные записки, тематическое планирование.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2a7f6f;      /* спокойный зелёный — заменяемо под бренд Kinderville */
      --sidebar-width: 320px;
    }
    .app-name-link img { max-width: 180px; }
    .markdown-section { max-width: 900px; }
    .markdown-section table { display: table; width: 100%; }
    .sidebar-nav > ul > li > span,
    .sidebar-nav > ul > li > strong,
    .sidebar-nav li > p > strong { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    blockquote { border-left: 4px solid var(--theme-color); background: #f6faf9; }
    #lang-toggle {
      position: fixed; top: 12px; right: 16px; z-index: 40;
      background: var(--theme-color); color: #fff; text-decoration: none;
      padding: 5px 14px; border-radius: 16px; font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    #lang-toggle:hover { opacity: .85; }
  </style>
</head>
<body>
  <div id="app">Загрузка портала…</div>
  <script>
    window.$docsify = {
      name: 'Портал педагогов',
      loadSidebar: true,
      fallbackLanguages: ['en'],
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            var path = vm.route.path || '/';
            var isEn = path === '/en' || path === '/en/' || path.indexOf('/en/') === 0;
            var target, label;
            if (isEn) {
              var ru = path.replace(/^\/en\/?/, '/');
              target = '#' + (ru || '/');
              label = 'Русский';
            } else {
              target = '#/en' + (path === '/' ? '/' : path);
              label = 'English';
            }
            var el = document.getElementById('lang-toggle');
            if (!el) {
              el = document.createElement('a');
              el.id = 'lang-toggle';
              document.body.appendChild(el);
            }
            el.setAttribute('href', target);
            el.textContent = label;
          });
        }
      ],
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      homepage: 'README.md',
      search: {
        placeholder: 'Поиск по порталу…',
        noData: 'Ничего не найдено',
        depth: 4
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
