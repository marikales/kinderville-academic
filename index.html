<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Портал педагогов Kinderville</title>
  <meta name="description" content="Методические материалы Kinderville для педагогов: программы, пояснительные записки, тематическое планирование.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2a7f6f;      /* спокойный зелёный — заменяемо под бренд Kinderville */
      --sidebar-width: 320px;
    }
    .app-name-link img { max-width: 180px; }
    .markdown-section { max-width: 900px; }
    .markdown-section table { display: table; width: 100%; }
    .sidebar-nav li > span,
    .sidebar-nav li > strong,
    .sidebar-nav li > p > strong { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .sidebar-nav li.active > a,
    .sidebar-nav li.collapse > a,
    .sidebar-nav a { font-weight: 400 !important; }
    .sidebar-nav li.active > a { color: var(--theme-color); }
    blockquote { border-left: 4px solid var(--theme-color); background: #f6faf9; }
    #lang-toggle {
      position: fixed; top: 12px; right: 16px; z-index: 40;
      background: var(--theme-color); color: #fff; text-decoration: none;
      padding: 5px 14px; border-radius: 16px; font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    #lang-toggle:hover { opacity: .85; }

    /* ---------- Мобильная версия ---------- */
    /* Штатная тема docsify открывает боковое меню через transform на fixed-
       элементе и одновременно сдвигает текст вправо. В мобильном Safari слой
       меню не отрисовывался: текст уезжал, а слева оставалось пустое поле.
       Здесь меню выезжает поверх текста через left, текст остаётся на месте. */
    @media screen and (max-width: 768px) {
      .sidebar {
        width: min(86vw, 320px);
        left: -100vw;
        padding-top: 52px !important; /* перебиваем плагин поиска — иначе поле уезжает под кнопку */
        background: #fff;
        box-shadow: 2px 0 18px rgba(0, 0, 0, .18);
        transform: none !important;
        transition: none !important;
        z-index: 60;
      }
      body.close .sidebar { left: 0; }

      .content,
      body.close .content { transform: none !important; }

      /* Кнопка меню — сверху слева: снизу её перекрывает панель браузера */
      .sidebar-toggle,
      body.close .sidebar-toggle {
        top: 0; bottom: auto;
        width: auto;
        padding: 14px 16px;
        background: transparent;
        z-index: 70;
      }
      .sidebar-toggle span { width: 22px; height: 2px; margin-bottom: 5px; }

      .markdown-section { padding-top: 44px; }
      body.close #lang-toggle { display: none; }
    }
    /* Переключатель кампуса в меню: школа / сад, «Общее» видно всегда (Марика 19.11) */
    #campus-switch { display:flex; gap:4px; margin:4px 15px 10px; background:#eef4f2; border-radius:10px; padding:3px; }
    #campus-switch button { flex:1; border:0; background:transparent; padding:7px 6px; border-radius:8px; font-size:13px; color:#4d6a64; cursor:pointer; }
    #campus-switch button.on { background:#fff; color:var(--theme-color); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
    .sidebar-nav li[data-campus] { margin-top:6px; }
    .sidebar-nav li[hidden] { display:none !important; }
    .sidebar ul li a { white-space:normal !important; overflow:visible !important; text-overflow:clip !important; }
  </style>
</head>
<body>
  <div id="app">Загрузка портала…</div>
  <script>
    window.$docsify = {
      name: 'Портал педагогов',
      loadSidebar: true,
      fallbackLanguages: ['en'],
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            var path = vm.route.path || '/';
            var isEn = path === '/en' || path === '/en/' || path.indexOf('/en/') === 0;
            var target, label;
            if (isEn) {
              var ru = path.replace(/^\/en\/?/, '/');
              target = '#' + (ru || '/');
              label = 'Русский';
            } else {
              target = '#/en' + (path === '/' ? '/' : path);
              label = 'English';
            }
            var el = document.getElementById('lang-toggle');
            if (!el) {
              el = document.createElement('a');
              el.id = 'lang-toggle';
              document.body.appendChild(el);
            }
            el.setAttribute('href', target);
            el.textContent = label;

            // Заголовок в меню и вкладке — на языке страницы
            var appName = document.querySelector('.app-name-link');
            if (appName) {
              appName.textContent = isEn ? 'Teacher portal' : 'Портал педагогов';
              appName.setAttribute('href', isEn ? '#/en/' : '#/');
            }
            document.title = isEn ? 'Kinderville teacher portal' : 'Портал педагогов Kinderville';
            document.documentElement.lang = isEn ? 'en' : 'ru';

            // Кампус в меню: показываем пункты одного кампуса + «Общее»
            (function () {
              var nav = document.querySelector('.sidebar-nav');
              var ul = nav && nav.querySelector(':scope > ul');
              if (!ul) return;
              var tops = [].slice.call(ul.children);
              tops.forEach(function (li) {
                var st = li.querySelector(':scope > strong, :scope > p > strong');
                if (!st) return;
                var t = st.textContent.trim().toLowerCase();
                if (/^(школа|school)/.test(t)) li.setAttribute('data-campus', 'school');
                else if (/^(сад|kindergarten)/.test(t)) li.setAttribute('data-campus', 'kg');
                else if (/^(общее|general)/.test(t)) li.setAttribute('data-campus', 'common');
              });
              var cur = null;
              try { cur = localStorage.getItem('kv-campus'); } catch (e) {}
              if (/(ktp|meetings|science)/.test(path)) cur = 'school';
              var qc = vm.route.query && vm.route.query.campus;
              if (qc === 'kg' || qc === 'school') { cur = qc; try { localStorage.setItem('kv-campus', qc); } catch (e) {} }
              if (cur !== 'kg') cur = 'school';
              var sw = nav.querySelector('#campus-switch');
              if (!sw) { sw = document.createElement('div'); sw.id = 'campus-switch'; nav.insertBefore(sw, ul); }
              var labels = isEn ? { school: 'School', kg: 'Kindergarten' } : { school: 'Школа', kg: 'Сад' };
              function apply(c) {
                sw.innerHTML = ['school', 'kg'].map(function (k) {
                  return '<button type="button" data-c="' + k + '" class="' + (k === c ? 'on' : '') + '">' + labels[k] + '</button>';
                }).join('');
                tops.forEach(function (li) {
                  var k = li.getAttribute('data-campus');
                  li.hidden = !!k && k !== 'common' && k !== c;
                });
                [].forEach.call(sw.querySelectorAll('button'), function (b) {
                  b.onclick = function () {
                    try { localStorage.setItem('kv-campus', b.getAttribute('data-c')); } catch (e) {}
                    apply(b.getAttribute('data-c'));
                  };
                });
              }
              apply(cur);
            })();
          });
        }
      ],
      subMaxLevel: 0,  // меню без авто-заголовков страниц (Марика 19.11: «вычистить всё лишнее»)
      auto2top: true,
      maxLevel: 4,
      homepage: 'README.md',
      search: {
        placeholder: { '/en/': 'Search the portal…', '/': 'Поиск по порталу…' },
        noData: { '/en/': 'Nothing found', '/': 'Ничего не найдено' },
        depth: 4
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
